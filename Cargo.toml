[workspace]
members = ["crates/domain", "crates/application", "crates/adapters", "crates/cli"]
resolver = "2"

[workspace.package]
version = "0.4.9"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
tv-domain = { path = "crates/domain" }
tv-application = { path = "crates/application" }
tv-adapters = { path = "crates/adapters" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
      - run: python3 scripts/check_architecture.py
      - run: python3 scripts/audit_publication.py
      - run: python3 -W error::ResourceWarning scripts/test_mcp.py target/release/tv-control
      - run: target/release/tv-control validate examples/config.json
  arm64-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup target add aarch64-unknown-linux-musl
      - run: python3 scripts/cross_build.py
      - run: python3 scripts/package.py target/aarch64-unknown-linux-musl/release/tv-control dist/tv-control-aarch64-linux-musl.tar.gz
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tv-control-aarch64-linux-musl
          path: dist/*

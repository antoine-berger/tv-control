name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    # Public verification uses the published bytes; it must not rebuild them.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/verify/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: sh -n install.sh
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck busybox
          shellcheck --version
          shellcheck -s sh install.sh
          busybox sh -n install.sh
      - run: python3 -W error::ResourceWarning scripts/test_release.py
      - run: python3 -W error::ResourceWarning scripts/test_verify_public_release.py
      - run: python3 -W error::ResourceWarning scripts/test_installer.py
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo build --locked --release
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=.
          MACOSX_DEPLOYMENT_TARGET: "11.0"
      - name: Architecture and source quality
        run: |
          python3 scripts/check_architecture.py
          python3 -W error::ResourceWarning scripts/test_source_size.py
          python3 scripts/check_source_size.py
      - run: python3 scripts/audit_publication.py
      - run: python3 -W error::ResourceWarning scripts/test_mcp.py target/release/tv-control
      - run: python3 -W error::ResourceWarning scripts/test_media_read.py target/release/tv-control
      - run: python3 -W error::ResourceWarning scripts/test_generic_mcp.py target/release/tv-control
      - run: python3 -W error::ResourceWarning scripts/test_onboarding.py target/release/tv-control
      - run: python3 -W error::ResourceWarning scripts/test_install_flow.py target/release/tv-control
      - run: python3 -W error::ResourceWarning scripts/test_zero_arg_ux.py target/release/tv-control
      - run: python3 -W error::ResourceWarning scripts/test_journey_fixture.py target/release/tv-control
      - run: python3 -W error::ResourceWarning scripts/test_complete_journey.py target/release/tv-control
      - run: target/release/tv-control validate examples/config.json
      - if: runner.os == 'macOS'
        run: |
          target=$(rustc -vV | sed -n 's/^host: //p')
          python3 scripts/package.py target/release/tv-control "dist/tv-control-${target}.tar.gz"
          python3 scripts/check_package.py "dist/tv-control-${target}.tar.gz" --smoke
      - if: runner.os == 'macOS'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tv-control-macos-${{ runner.arch }}
          path: dist/*
  static-linux:
    # Public verification uses the published bytes; it must not rebuild them.
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/heads/verify/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            asset: aarch64-linux-musl
          - target: x86_64-unknown-linux-musl
            asset: x86_64-linux-musl
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup target add ${{ matrix.target }}
      - run: python3 scripts/cross_build.py --target ${{ matrix.target }}
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          target/${{ matrix.target }}/release/tv-control --version
          python3 scripts/test_onboarding.py target/${{ matrix.target }}/release/tv-control
      - run: python3 scripts/package.py target/${{ matrix.target }}/release/tv-control dist/tv-control-${{ matrix.asset }}.tar.gz
      - run: python3 scripts/check_package.py dist/tv-control-${{ matrix.asset }}.tar.gz
      - if: matrix.target == 'x86_64-unknown-linux-musl'
        run: python3 scripts/check_package.py dist/tv-control-${{ matrix.asset }}.tar.gz --smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tv-control-${{ matrix.asset }}
          path: dist/*

  release-prerelease:
    needs: [checks, static-linux]
    # Only an explicit, version-and-full-SHA-bound release branch can publish.
    # Main and PR builds retain read-only permissions and never enter this job.
    if: >-
      github.repository == 'antoine-berger/tv-control' &&
      github.event_name == 'push' &&
      github.event.deleted == false &&
      startsWith(github.ref, 'refs/heads/release/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: tv-control-prerelease
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # Omit github-token, repository and run-id: download only this run's assets.
      # Keep directories separate so duplicate installers cannot silently overwrite.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: tv-control-*
          path: release-artifacts
          merge-multiple: false
          digest-mismatch: error
      - name: Verify and publish non-latest prerelease
        run: python3 scripts/release.py release-artifacts --publish
        env:
          GH_TOKEN: ${{ github.token }}
          CHECKS_RESULT: ${{ needs.checks.result }}
          STATIC_LINUX_RESULT: ${{ needs.static-linux.result }}

  verify-public-release:
    if: >-
      github.repository == 'antoine-berger/tv-control' &&
      github.event_name == 'push' &&
      github.event.deleted == false &&
      startsWith(github.ref, 'refs/heads/verify/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate controller and select published source
        id: selected
        run: python3 scripts/verify_public_release.py select
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ steps.selected.outputs.source_sha }}
          path: release-source
          persist-credentials: false
      - name: Verify public downloads and native packaged installation
        run: python3 scripts/verify_public_release.py verify public-release-artifacts --source-root release-source
        env:
          GH_METADATA_TOKEN: ${{ github.token }}
